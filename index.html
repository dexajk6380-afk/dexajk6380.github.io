<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&family=Itim&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #dfeaf3;
  font-family: 'Itim','Kanit',sans-serif;
  color: #2b3a4a;
}

/* layout */
.container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 30px;
  padding: 40px;
}

/* กล่อง */
.box {
  background: #f8fbff;
  border-radius: 25px;
  border: 2px solid #9fbad0;
  padding: 20px;
}

/* หัว */
.header {
  font-size: 32px;
  padding: 20px;
}

/* ปุ่ม 3 อัน */
.social {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.social-box {
  flex: 1;
  background: #f8fbff;
  border-radius: 20px;
  border: 2px solid #9fbad0;
  padding: 15px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}

.social-box:hover {
  transform: translateY(-3px);
}

/* ขีดใต้ */
.bar {
  height: 6px;
  background: #9fbad0;
  border-radius: 10px;
  margin-top: 10px;
}

/* เส้นแบ่ง */
.line {
  height: 2px;
  background: #9fbad0;
  margin: 25px 0;
}

/* example text */
.example {
  font-size: 20px;
  margin-bottom: 10px;
}

/* grid */
.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
}

.card {
  height: 120px;
  border-radius: 20px;
  border: 2px solid #9fbad0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* ขวา */
.profile {
  text-align: center;
}

.status {
  font-size: 14px;
  margin-bottom: 10px;
}

.avatar {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 2px solid #9fbad0;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* name */
.name {
  margin-top: 20px;
  padding: 15px;
  border-radius: 20px;
  border: 2px solid #9fbad0;
  font-size: 24px;
}

/* description */
.desc {
  margin-top: 10px;
  font-size: 14px;
}

/* order box */
.order {
  margin-top: 20px;
  border-radius: 20px;
  border: 2px solid #9fbad0;
  padding: 15px;
  text-align: left;
}
</style>
</head>

<body>

<div class="container">

  <!-- ซ้าย -->
  <div>

    <div class="box header">
      ใส่รูป (โลโก้)
    </div>

    <div class="social">
      <div class="social-box">
        YouTube
        <div class="bar"></div>
      </div>

      <div class="social-box">
        TikTok
        <div class="bar"></div>
      </div>

      <div class="social-box">
        Discord
        <div class="bar"></div>
      </div>
    </div>

    <div class="line"></div>

    <div class="example">Example ♡</div>

    <div class="grid">
      <div class="card">ข้อความ</div>
      <div class="card">ข้อความ</div>
      <div class="card">ข้อความ</div>
      <div class="card">ข้อความ</div>
      <div class="card">ข้อความ</div>
      <div class="card">ข้อความ</div>
    </div>

  </div>

  <!-- ขวา -->
  <div class="box profile">

    <div class="status">สถานะ (ข้อความ)</div>

    <div class="avatar">
      ใส่รูป
    </div>

    <div class="name">Name</div>

    <div class="desc">คำอธิบาย (แนะนำตัว)</div>

    <div class="order">
      ♥ วิธีสั่งงาน
      <p>พิมพ์รายละเอียด</p>
    </div>

  </div>

</div>

</body>
</html>
