<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>My Bio</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins','Kanit',sans-serif;
  background: #eaf4fb;
  color: #1e293b;
}

.container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 20px;
  padding: 20px;
}

.box {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

/* ปุ่มลิงก์ */
.categories {
  display: flex;
  gap: 10px;
}

.cat {
  flex: 1;
  text-align: center;
  padding: 10px;
  border-radius: 15px;
  background: #e0f2fe;
  text-decoration: none;
  color: #0369a1;
  transition: 0.2s;
}
.cat:hover {
  background: #bae6fd;
}

/* grid */
.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 15px;
}

.item {
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
}

.item img {
  width: 100%;
  height: 100px;
  object-fit: cover;
}

.item:hover {
  transform: scale(1.05);
}

/* profile */
.profile {
  text-align: center;
}
.profile img {
  width: 140px;
  border-radius: 50%;
}

/* modal */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 300px;
}

.modal-content img {
  width: 100%;
  border-radius: 10px;
}

</style>
</head>

<body>

<div class="container">

  <!-- ซ้าย -->
  <div>

    <!-- ลิงก์ -->
    <div class="categories">
      <a href="https://youtube.com" class="cat">YouTube</a>
      <a href="https://tiktok.com" class="cat">TikTok</a>
      <a href="https://discord.com" class="cat">Discord</a>
    </div>

    <!-- portfolio -->
    <div class="box">
      <b>Portfolio</b>
      <div class="grid">

        <div class="item" onclick="openModal('img1.jpg','งานวาด 1','รายละเอียดงาน')">
          <img src="img1.jpg">
        </div>

        <div class="item" onclick="openModal('img2.jpg','งานวาด 2','รายละเอียดงาน')">
          <img src="img2.jpg">
        </div>

        <div class="item" onclick="openModal('img3.jpg','งานวาด 3','รายละเอียดงาน')">
          <img src="img3.jpg">
        </div>

        <div class="item" onclick="openModal('img4.jpg','งานวาด 4','รายละเอียดงาน')">
          <img src="img4.jpg">
        </div>

        <div class="item" onclick="openModal('img5.jpg','งานวาด 5','รายละเอียดงาน')">
          <img src="img5.jpg">
        </div>

        <div class="item" onclick="openModal('img6.jpg','งานวาด 6','รายละเอียดงาน')">
          <img src="img6.jpg">
        </div>

      </div>
    </div>

  </div>

  <!-- ขวา -->
  <div class="box profile">
    <img src="profile.jpg">
    <h3>Name</h3>
    <p>คำอธิบายสั้น ๆ</p>

    <div class="box">
      <b>วิธีสั่งงาน</b>
      <p>พิมพ์รายละเอียด</p>
    </div>
  </div>

</div>

<!-- modal -->
<div class="modal" id="modal" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <img id="modalImg">
    <h3 id="modalTitle"></h3>
    <p id="modalDesc"></p>
  </div>
</div>

<script>
function openModal(img, title, desc) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = img;
  document.getElementById("modalTitle").innerText = title;
  document.getElementById("modalDesc").innerText = desc;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
