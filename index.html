<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Novara</title>

<!-- ฟอนต์นุ่ม ไทย + อังกฤษ -->
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins','Kanit',sans-serif;
  background: linear-gradient(135deg, #e0f2fe, #0ea5e9);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: #0f172a;
}

/* card */
.card {
  background: white;
  padding: 30px;
  border-radius: 25px;
  width: 280px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);

  /* animation ตอนโหลด */
  opacity: 0;
  transform: translateY(20px);
  animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* profile */
.profile {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 10px;
}

/* name */
h1 {
  margin: 10px 0 5px;
  font-weight: 500;
}

p {
  margin: 5px 0;
  font-size: 14px;
  opacity: 0.7;
}

/* link */
.btn {
  display: block;
  margin: 10px 0;
  padding: 10px;
  border-radius: 12px;
  text-decoration: none;
  background: #e0f2fe;
  color: #0369a1;
  transition: 0.2s;
}

/* hover animation */
.btn:hover {
  background: #bae6fd;
  transform: translateY(-2px);
}

</style>
</head>

<body>

<div class="card">
  <img src="https://via.placeholder.com/150" class="profile">

  <h1>Novara</h1>
  <p>Pngtuber</p>

  <a href="#" class="btn">YouTube</a>
  <a href="#" class="btn">Tiktok</a>
  <a href="#" class="btn">Discord</a>
</div>

</body>
</html>
