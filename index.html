<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&family=Itim&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: #dfeaf3;
  font-family: 'Itim','Kanit',sans-serif;
}

/* layout */
.container {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 30px;
  padding: 40px;
}

/* กล่อง */
.box {
  background: #f8fbff;
  border-radius: 25px;
  border: 2px solid #9fbad0;
  padding: 20px;
}

/* header */
.header {
  font-size: 28px;
  padding: 20px;
}

/* social */
.social {
  display: flex;
  gap: 20px;
  margin-top: 20px;
}

.social-box {
  flex: 1;
  border: 2px solid #9fbad0;
  border-radius: 20px;
  padding: 15px;
  text-align: center;
  cursor: pointer;
}

.bar {
  height: 6px;
  background: #9fbad0;
  border-radius: 10px;
  margin-top: 10px;
}

/* line */
.line {
  height: 2px;
  background: #9fbad0;
  margin: 25px 0;
}

/* grid */
.grid {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 20px;
}

.card {
  height: 120px;
  border-radius: 20px;
  border: 2px solid #9fbad0;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* profile */
.profile {
  text-align: center;
}

.avatar {
  width: 200px;
  height: 200px;
  border-radius: 50%;
  border: 2px solid #9fbad0;
  margin: auto;
}

.name {
  margin-top: 15px;
  padding: 10px;
  border: 2px solid #9fbad0;
  border-radius: 20px;
}

.order {
  margin-top: 20px;
  border: 2px solid #9fbad0;
  border-radius: 20px;
  padding: 15px;
  text-align: left;
}

/* popup */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-box {
  background: white;
  width: 80%;
  max-height: 80%;
  overflow-y: auto;
  border-radius: 20px;
  padding: 20px;
}

.modal-box img {
  width: 100%;
  margin-bottom: 10px;
  border-radius: 10px;
}

.close {
  background: #9fbad0;
  border: none;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- เพลง -->
<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <!-- ซ้าย -->
  <div>

    <div class="box header">โลโก้</div>

    <div class="social">
      <div class="social-box" onclick="go('https://youtube.com')">YouTube<div class="bar"></div></div>
      <div class="social-box" onclick="go('https://tiktok.com')">TikTok<div class="bar"></div></div>
      <div class="social-box" onclick="go('https://discord.com')">Discord<div class="bar"></div></div>
    </div>

    <div class="line"></div>

    <div>Example ♡</div>

    <div class="grid">
      <div class="card" onclick="openModal(1)">งาน</div>
      <div class="card" onclick="openModal(2)">งาน</div>
      <div class="card" onclick="openModal(3)">งาน</div>
      <div class="card" onclick="openModal(4)">งาน</div>
      <div class="card" onclick="openModal(5)">งาน</div>
      <div class="card" onclick="openModal(6)">งาน</div>
    </div>

  </div>

  <!-- ขวา -->
  <div class="box profile">
    <p>สถานะ</p>
    <div class="avatar"></div>
    <div class="name">Name</div>
    <p>คำอธิบาย</p>

    <div class="order">
      ♥ วิธีสั่งงาน
      <p>รายละเอียด</p>
    </div>
  </div>

</div>

<!-- popup -->
<div class="modal" id="modal">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">ปิด</button>
    <div id="gallery"></div>
  </div>
</div>

<script>
function go(link){
  window.open(link, "_blank");
}

function openModal(id){
  const modal = document.getElementById("modal");
  const gallery = document.getElementById("gallery");

  gallery.innerHTML = "";

  // ใส่รูปหลายรูปต่อ 1 งาน
  for(let i=1;i<=3;i++){
    let img = document.createElement("img");
    img.src = "work"+id+"-"+i+".jpg";
    gallery.appendChild(img);
  }

  modal.style.display = "flex";
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
